services:
  backend:
    build: ./Backend
    container_name: news-today-backend
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    environment:
      NODE_ENV: production
      CLIENT_URL: https://actualidadlocal.es
    volumes:
      - ./Backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - red_compartida

  frontend:
    build: ./Frontend
    container_name: news-today-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - red_compartida

networks:
  red_compartida:
    external: true
