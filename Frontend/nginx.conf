map $http_user_agent $render_bot {
    default 0;
    ~*whatsapp 1;
    ~*facebookexternalhit 1;
    ~*facebot 1;
    ~*facebookbot 1;
    ~*twitterbot 1;
    ~*linkedinbot 1;
    ~*slackbot 1;
    ~*discordbot 1;
    ~*telegram 1;
    ~*viber 1;
    ~*line 1;
    ~*pinterest 1;
    ~*skypeuripreview 1;
    ~*googlebot 1;
    ~*bingbot 1;
    ~*yandex 1;
    ~*baiduspider 1;
    ~*duckduckbot 1;
    ~*applebot 1;
    ~*meta-externalagent 1;
    ~*snapchat 1;
    ~*tiktok 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 75m;

    location /api/ {
        proxy_pass http://news-today-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://news-today-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location = /robots.txt {
        proxy_pass http://news-today-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://news-today-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ @spa;
    }

    location @spa {
        if ($render_bot = 1) {
            proxy_pass http://news-today-backend:8080;
        }
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Prerender 1;
        proxy_read_timeout 60s;
        try_files /index.html =404;
    }
}
